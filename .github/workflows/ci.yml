name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: fixtures
          key: fixtures-${{ hashFiles('Makefile', 'tunes/*/Makefile') }}
          restore-keys: fixtures-
      - run: make fixture
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: deps
          load: true
          tags: gravity-inversion-deps
          cache-from: type=gha
      - name: Readability and PRG ratchets
        run: >-
          docker run --rm -v "$PWD:/src" -w /src gravity-inversion-deps
          sh -c 'git config --global --add safe.directory /src
          && make readability AGAINST=origin/main
          && make prg AGAINST=origin/main'
