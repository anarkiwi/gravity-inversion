[tool.pylint.main]
source-roots = ["tools", "tunes/commando", "tunes/automatas", "tunes/ghouls", "tunes/incoherent"]
init-hook = "import glob, sys; sys.path[:0] = ['tools'] + sorted(glob.glob('tunes/*/'))"

[tool.pylint.design]
max-locals = 20
max-args = 6

[tool.pylint.typecheck]
generated-members = ["run_to_rts", "run_until"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests", "tunes"]
pythonpath = ["tools"]
markers = ["slow: whole-tune and permutation traces of generated C"]
