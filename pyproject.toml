[tool.pylint.main]
source-roots = ["tools", "tunes/commando", "tunes/automatas", "tunes/ghouls", "tunes/incoherent"]
init-hook = "import glob, sys; sys.path[:0] = ['tools'] + sorted(glob.glob('tunes/*/'))"

[tool.pylint.design]
max-locals = 20
max-args = 6

[tool.pylint.typecheck]
generated-members = ["run_to_rts", "run_until"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests", "tunes"]
pythonpath = ["tools"]
markers = ["slow: whole-tune and permutation traces of generated C"]

# Code here must not duplicate code its dependencies already export (pysayme). A key in
# `allow` is a deliberate duplicate; its value says why.
[tool.pysayme]
roots = ["tools", "tunes", "tests"]
requirements = "requirements.txt"

[tool.pysayme.allow]
"tools/flowgraph.py:reach -> deity_informant.cgen.structure:subtree" = "generic worklist walk over a different graph (call graph, not dominator tree)"
"tools/eventlog.py:origins -> jennings.acme:read_symbol_list" = "parses cgen .h ORG defines, not an ACME symbol list"
"tests/test_ghidra_ref.py:_image -> deity_informant.cgen.mlir:have_docker_image" = "probes the gi-ghidra image; DI's helper hardcodes di-mlir"
"tools/irflow.py:ENTRY -> deity_informant.cgen.traps:ENTRY" = "coincidental string"
