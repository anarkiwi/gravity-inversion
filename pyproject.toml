[tool.pylint.main]
source-roots = ["tools", "tunes/commando", "tunes/automatas", "tunes/ghouls", "tunes/incoherent"]
init-hook = "import glob, sys; sys.path[:0] = ['tools'] + sorted(glob.glob('tunes/*/'))"

[tool.pylint.design]
max-locals = 20
max-args = 6

[tool.pylint.typecheck]
generated-members = ["run_to_rts", "run_until"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests", "tunes"]
pythonpath = ["tools"]
markers = ["slow: whole-tune and permutation traces of generated C"]

# Code here must not duplicate code its dependencies already export (pysayme). A key in
# `allow` is a deliberate duplicate; its value says why.
[tool.pysayme]
roots = ["tools", "tunes", "tests"]
requirements = "requirements.txt"

[tool.pysayme.allow]
"tools/sidtrace.py:overrun_sources -> deity_informant.orbit:sources" = "also takes `last` as one address and leaves the I/O range as it stands, which DI's per-run form does not"
"tools/sidtrace.py:boot -> tools/relocate.py:_plan" = "coincidental loop shape: _plan's span scans share nothing with boot's poke and setup sequence"
"tunes/ghouls/gen_ghouls.py:_merge -> jennings.image:Image.merged" = "unions a plain list of spans; Image.merged reads an image's own spans"
"tools/flowgraph.py:reach -> deity_informant.cgen.structure:subtree" = "generic worklist walk over a different graph (call graph, not dominator tree)"
"tools/eventlog.py:origins -> jennings.acme:read_symbol_list" = "parses cgen .h ORG defines, not an ACME symbol list"
"tests/test_ghidra_ref.py:_image -> deity_informant.cgen.mlir:have_docker_image" = "probes the gi-ghidra image; DI's helper hardcodes di-mlir"
"tools/irflow.py:ENTRY -> deity_informant.cgen.traps:ENTRY" = "coincidental string"
"tests/test_fcomplex.py:fixture_src -> tests/test_flow.py:_player" = "each writes its own C source to tmp_path/gen.c; the flow player also needs the empty .h beside it"
"tests/test_flow.py:_g -> tools/orbitflow.py:graph" = "networkx MultiDiGraph built from {node: kind} and edges: a test fixture beside orbitflow's keyed, witnessed edges"
"tools/disasm.py:listing -> tools/sidtrace.py:boot" = "argument-defaulting calls into jennings' Listing and pysidtracker's boot_flat; no shared logic"
"tunes/automatas/gen_automatas.py:held -> tunes/incoherent/gen_incoherent.py:held" = "the per-tune footprint protocol (docs/footprint.md): each tune's own arrays and addresses"
"tunes/automatas/tests/test_automatas.py:test_data_footprint -> tunes/incoherent/tests/test_incoherent.py:test_data_footprint" = "each binds tunetest.assert_clean to its own song length and VARIANTS"
"tunes/automatas/tests/test_automatas.py:test_variant_c_identical -> tunes/incoherent/tests/test_incoherent.py:test_variant_c_identical" = "each binds tunetest.assert_same_c to its own VARIANTS"
